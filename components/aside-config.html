<aside id="aside-config" class="aside-drawer aside-config">
    <!-- Botón flotante para desplegar/colapsar -->
    <button id="aside-button-toggle" class="aside-button-toggle" aria-label="Abrir panel de opciones">
        <span id="icono-toggle" class="aside-icon-toggle">&lt;</span>
    </button>
    <!-- Contenido del panel (Modo oscuro, Clima, etc.) -->
    <div id="aside-options" class="aside-options">
        <h3>Opciones</h3>
        <!-- Botón de Modo Oscuro -->
        <button id="button-theme" class="button button-theme" data-set-theme="dark">Modo oscuro</button>
        <!-- Botón de Alto Contraste -->
        <button id="button-high-contrast" class="button button-high-contrast" data-set-theme="high-contrast">Alto contraste</button>
        <!-- Botón de Modo Monocromático -->
        <button id="button-grayscale" class="button button-grayscale" data-set-theme="grayscale">Escala de grises</button>
        <!-- Botón de Modo Descanso -->
        <button id="button-rest" class="button button-rest" data-set-theme="rest">Modo descanso</button>
        <!-- Widget de Clima Local (Villa Dolores) -->
        <div class="weather-widget" id="weather-widget">
            <span class="weather-icon" id="weather-icon">☀️</span>
            <span class="weather-temp" id="weather-temp">--°C</span>
            <span class="weather-location">Villa Dolores</span>
        </div>
        <!-- Botón de Copiar Link de la Web -->
        <button id="button-copy-link" class="button button-copy-link">Copiar enlace</button>
    </div>
</aside>

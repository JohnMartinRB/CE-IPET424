<aside id="aside-config" class="aside-drawer aside-config">
    <!-- Botón flotante para desplegar/colapsar -->
    <button id="button-toggle-aside" class="button-toggle-aside" aria-label="Abrir panel de opciones">
        <span id="icono-toggle" class="icono-toggle">&lt;</span>
    </button>
    <!-- Contenido del panel (Modo oscuro, Clima, etc.) -->
    <div id="options" class="options">
        <h3>Opciones</h3>
        <!-- Botón de Modo Oscuro -->
        <button id="button-theme" class="button button-theme">Modo Oscuro 🌙</button>
        <!-- Botón de Alto Contraste -->
        <button id="button-contrast" class="button button-contrast">Alto Contraste 🌟</button>
        <!-- Botón de Modo Monocromático -->
        <button id="button-monochrome" class="button button-monochrome">Escala de Grises 🌑</button>
        <!-- Widget de Clima Local (Villa Dolores) -->
        <div class="weather-widget" id="weather-widget">
            <span class="weather-icon" id="weather-icon">☀️</span>
            <span class="weather-temp" id="weather-temp">--°C</span>
            <span class="weather-location">Villa Dolores</span>
        </div>
        <!-- Botón de Copiar Link de la Web -->
        <button id="button-copy-link" class="button button-copy-link">Copiar Enlace De la Web 🔗</button>
    </div>
</aside>

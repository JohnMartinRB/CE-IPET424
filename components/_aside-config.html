<aside id="aside-config" class="aside-drawer aside-config">
    <button
        id="aside-config-button-toggle"
        class="aside-button-toggle aside-config-button-toggle"
        aria-label="Abrir panel de opciones"
    >
        <span id="aside-config-icon-toggle" class="aside-icon-toggle">▶</span>
    </button>
    <div id="aside-config-options" class="aside-options">
        <!-- TEMAS (Todos los modificadores de paletas) -->
        <h3>Temas</h3>
        <button id="button-theme" class="button button-theme" data-set-theme="dark">Modo oscuro</button>
        <button id="button-high-contrast" class="button button-high-contrast" data-set-theme="high-contrast">
            Alto contraste
        </button>
        <button id="button-code" class="button button-code" data-set-theme="code">Modo código</button>
        <button id="button-grayscale" class="button button-grayscale" data-set-theme="grayscale">
            Escala de grises
        </button>
        <button id="button-colorblind" class="button button-colorblind" data-set-theme="colorblind">
            Modo daltónico
        </button>
        <!-- ACCESIBILIDAD (Herramientas directas de lectura y tipografía) -->
        <h3>Accesibilidad</h3>
        <button id="button-dyslexic" class="button button-dyslexic">Modo dislexia: sí</button>
        <div class="font-size-control-container">
            <h4 class="font-size-label">Tamaño de texto</h4>
            <div class="font-size-buttons-group">
                <button id="button-font-decrease" class="button button-small" aria-label="Achicar tamaño de texto">
                    A-
                </button>
                <span id="font-size-indicator" class="font-size-value">100%</span>
                <button id="button-font-increase" class="button button-small" aria-label="Agrandar tamaño de texto">
                    A+
                </button>
                <button id="button-font-reset" class="button button-small" aria-label="Restablecer tamaño de texto">
                    ↻
                </button>
            </div>
        </div>
        <!-- OPCIONES / PREFERENCIAS (Comportamiento de la interfaz) -->
        <h3>Opciones</h3>
        <button id="button-sound" class="button button-sound">Sonido: sí</button>
        <button id="button-animations" class="button button-animations">Animaciones: sí</button>
        <button id="button-rest" class="button button-rest" data-set-theme="rest">Modo descanso</button>
        <!-- OTROS (Utilidades varias y widgets) -->
        <h3>Otros</h3>
        <button id="button-copy-link" class="button button-copy-link">Copiar enlace web</button>
        <div id="weather-widget" class="widget weather-widget">
            <span class="weather-icon" id="weather-icon">☀️</span>
            <span class="weather-temp" id="weather-temp">--°C</span>
            <span class="weather-location">Villa Dolores</span>
        </div>
    </div>
</aside>

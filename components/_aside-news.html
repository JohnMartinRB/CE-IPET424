<aside id="aside-news" class="aside-drawer aside-news">
    <button
        id="aside-news-button-toggle"
        class="aside-button-toggle aside-news-button-toggle"
        aria-label="Abrir panel de novedades"
    >
        <span id="aside-news-icon-toggle" class="aside-icon-toggle">◀</span>
    </button>
    <div id="aside-news-options" class="aside-options">
        <!-- WIDGET DE DATOS CURIOSOS -->
        <div id="facts-widget" class="widget facts-widget">
            <div class="facts-header">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#ffffff"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="facts-icon icon icon-tabler icons-tabler-outline icon-tabler-bulb"
                >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" />
                    <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" />
                    <path d="M9.7 17l4.6 0" />
                </svg>
                <h3>¿Sabías que...?</h3>
            </div>
            <div class="facts-content">
                <p id="fact-text">Cargando dato curioso...</p>
            </div>
        </div>
        <button id="button-reroll-fact" class="button button-reroll-fact" aria-label="Mostrar otro dato">
            Otro dato ↻
        </button>
        <!-- WIDGET DE PRÓXIMOS FERIADOS -->
        <div id="holidays-widget" class="widget holidays-widget">
            <div class="holidays-header">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#ffffff"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="holidays-icon icon icon-tabler icons-tabler-outline icon-tabler-calendar-week"
                >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12" />
                    <path d="M16 3v4" />
                    <path d="M8 3v4" />
                    <path d="M4 11h16" />
                    <path d="M7 14h.013" />
                    <path d="M10.01 14h.005" />
                    <path d="M13.01 14h.005" />
                    <path d="M16.015 14h.005" />
                    <path d="M13.015 17h.005" />
                    <path d="M7.01 17h.005" />
                    <path d="M10.01 17h.005" />
                </svg>
                <h3>Próximo Feriado</h3>
            </div>
            <div class="holidays-content" id="holiday-container">
                <p id="holidays-text">Calculando próximo feriado...</p>
            </div>
        </div>
    </div>
</aside>

<aside id="aside-news" class="aside-drawer aside-news">
    <button
        id="aside-news-button-toggle"
        class="aside-button-toggle aside-news-button-toggle"
        aria-label="Abrir panel de novedades"
    >
        <span id="aside-news-icon-toggle" class="aside-icon-toggle">◀</span>
    </button>
    <div id="aside-news-options" class="aside-options">
        <!-- WIDGET DE PRÓXIMOS FERIADOS -->
        <div id="holidays-widget" class="widget holidays-widget">
            <div id="holidays-header" class="widget-header">
                <img src="assets/img/icons/widget/holiday.svg" class="widget-icon" loading="lazy" />
                <h3 class="widget-title">Próximo Feriado</h3>
            </div>
            <div id="holidays-content" class="holidays-content">
                <p id="holidays-text">Calculando próximo feriado...</p>
            </div>
        </div>
        <!-- WIDGET DE FRASE DIARIA -->
        <div id="quote-widget" class="quote-widget widget">
            <div id="quote-header" class="widget-header">
                <img src="assets/img/icons/widget/quote.svg" class="widget-icon" loading="lazy" />
                <h3 class="widget-title">Frase del Día</h3>
            </div>
            <div class="widget-content">
                <p id="quote-text" class="widget-text">Cargando frase...</p>
                <span id="quote-author" class="quote-author"></span>
            </div>
        </div>
        <!-- WIDGET DE DATOS CURIOSOS -->
        <div id="facts-widget" class="widget facts-widget">
            <div id="facts-header" class="widget-header">
                <img src="assets/img/icons/widget/fact.svg" class="widget-icon" loading="lazy" />
                <h3 class="widget-title">¿Sabías que...?</h3>
            </div>
            <div class="facts-content">
                <p id="fact-text">Cargando dato curioso...</p>
            </div>
            <button
                id="button-reroll-fact"
                class="button config-button button-reroll-fact"
                aria-label="Mostrar otro dato"
            >
                Otro dato ⟲
            </button>
        </div>
        <!-- WIDGET DE TIEMPO ATMOSFÉRICO -->
        <div id="weather-widget" class="widget weather-widget">
            <div id="weather-header" class="widget-header">
                <img src="assets/img/icons/widget/weather.svg" class="widget-icon" loading="lazy" />
                <h3 class="widget-title">El Tiempo y Hora</h3>
            </div>
            <div class="weather-content">
                <div id="weather-datetime" class="weather-datetime">
                    <div id="weather-time" class="weather-time">--:--:--</div>
                    <div id="weather-date" class="weather-date">Cargando fecha...</div>
                </div>
                <div class="weather-main-info">
                    <span class="weather-icon" id="weather-icon">☀️</span>
                    <span class="weather-temp" id="weather-temp">--°C</span>
                    <span class="weather-location">Villa Dolores</span>
                </div>
            </div>
        </div>
    </div>
</aside>

<!doctype html>
<html lang="es">
    <head>
        <!-- ETIQUETAS META -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta
            name="description"
            content="Sitio oficial del Centro de Estudiantes IPET 424. Novedades, proyectos y contacto."
        />
        <meta name="theme-color" id="theme-color" content="#0088FF" />
        <!-- TITULO DE LA PESTAÑA Y FAVICON -->
        <title>Calendario | Centro de Estudiantes IPET N° 424</title>
        <link rel="icon" id="favicon" type="image/png" href="assets/img/favicons/light.png" sizes="any" />
        <!-- CSS Y JAVASCRIPT -->
        <link rel="stylesheet" href="css/styles.css" />
        <script type="module" src="js/main.js"></script>
        <script src="assets/libs/html2canvas.min.js"></script>
        <script src="assets/libs/jspdf.umd.min.js"></script>
    </head>

    <body>
        <!-- HEADER DE TITULO -->
        <div id="header-container" class="header-container"></div>
        <!-- PANEL LATERAL DE CONFIGURACIÓN -->
        <div id="aside-config-container" class="aside-config-container"></div>
        <!-- PANEL LATERAL DE NOVEDADES -->
        <div id="aside-news-container" class="aside-news-container"></div>
        <!-- CONTENEDOR PRINCIPAL -->
        <div id="content-card" class="content-card">
            <main>
                <!-- SECCIÓN 1: CALENDARIO Y DESCARGA -->
                <section id="calendario" class="section-card calendario-section">
                    <h2>Generador de Calendario Anual Personalizable</h2>
                    <p class="subtitle-section paragraph text">
                        Diseñá tu propio calendario para imprimir, armá tus feriados y organizá tu año.
                    </p>
                    <!-- Panel de Controles de Personalización -->
                    <div class="controls-panel">
                        <div class="control-group">
                            <label for="select-year">Año:</label>
                            <select id="select-year">
                                <option value="2026" selected>2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="select-view">Formato de Descarga:</label>
                            <select id="select-view">
                                <option value="12-hojas">Mensual (12 Páginas - Casilleros Grandes)</option>
                                <option value="1-hoja">Anual Compacto (1 Página - Todo el Año)</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="select-font">Tipografía:</label>
                            <select id="select-font">
                                <option value="Nunito">Nunito</option>
                                <option value="Nunito Sans">Nunito Sans</option>
                                <option value="Arial">Arial</option>
                                <option value="Calibri">Calibri</option>
                                <option value="Atkinson Hyperlegible">Dislexia</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="accent-color">Color de Encabezados:</label>
                            <input type="color" id="accent-color" value="#2b6cb0" />
                        </div>
                    </div>
                    <!-- CONTENEDOR DINÁMICO: Aquí JavaScript generará los meses -->
                    <div id="calendar-container" class="calendar-container vista-12-hojas">
                        <!-- Los meses se dibujarán automáticamente aquí -->
                        <p class="placeholder-text">Cargando calendarios...</p>
                    </div>
                    <div class="control-group">
                        <label for="select-format">Formato de Descarga:</label>
                        <select id="select-format">
                            <option value="image" selected>Imagen PNG</option>
                            <option value="pdf">Documento PDF</option>
                        </select>
                    </div>
                    <!-- Botón de descarga en PDF -->
                    <button id="button-download-calendar" class="button">Descargar Calendario</button>
                </section>
                <!-- SECCIÓN 6: SUB SITIOS -->
                <section class="section-card">
                    <li><a class="button" href="horarios.html">Horarios</a></li>
                </section>
            </main>
        </div>
        <!-- PIE DE PÁGINA -->
        <div id="footer-container" class="footer-container"></div>
        <!-- BOTÓN DE VOLVER ARRIBA -->
        <button class="button-round button-scroll-top" id="button-scroll-top" aria-label="Volver arriba">↑</button>
        <!-- VENTANA MODAL "EN DESARROLLO" -->
        <div id="modal-in-dev-container" class="modal-in-dev-container"></div>
        <!-- VENTANA MODAL DE NOVEDADES -->
        <div id="modal-whats-new-container" class="modal-whats-new-container"></div>
    </body>
</html>
